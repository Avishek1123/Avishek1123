<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Make it work. Make it scale. Full stack, cloud, product." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 -20) rotate(30) scale(760 420)">
      <stop offset="0" stop-color="#E10600" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#7a0300" stop-opacity=".35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF3B30"/>
    </linearGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .h{font-family:'Arial Black','Helvetica Neue',Impact,Arial,sans-serif;font-weight:900;font-size:96px;fill:#F5F5F5}
      .r{fill:#FF1F1A}
      .sub{font-family:'Helvetica Neue',Arial,sans-serif;font-size:17px;letter-spacing:7px;fill:#9a9a9a}
      .m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:16px}
      .lbl{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:17px;fill:#F5F5F5;letter-spacing:2px}
      .tech{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:13px;fill:#8a8a8a}
      .ring{fill:none;stroke:#FF1F1A;stroke-width:2;transform-box:fill-box;transform-origin:center;opacity:0}
      .a1{animation:p1 8s infinite}.a2{animation:p2 8s infinite}.a3{animation:p3 8s infinite}
      @keyframes p1{0%{transform:scale(1);opacity:.9}9%{transform:scale(2.6);opacity:0}100%{opacity:0}}
      @keyframes p2{0%,37%{transform:scale(1);opacity:0}38%{opacity:.9}47%{transform:scale(2.6);opacity:0}100%{opacity:0}}
      @keyframes p3{0%,74%{transform:scale(1);opacity:0}75%{opacity:.9}84%{transform:scale(2.6);opacity:0}100%{opacity:0}}
      .l1{animation:l1 8s infinite}.l2{animation:l2 8s infinite}.l3{animation:l3 8s infinite}
      @keyframes l1{0%,12%{opacity:0}16%,94%{opacity:1}98%,100%{opacity:0}}
      @keyframes l2{0%,43%{opacity:0}47%,94%{opacity:1}98%,100%{opacity:0}}
      @keyframes l3{0%,74%{opacity:0}78%,94%{opacity:1}98%,100%{opacity:0}}
      .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.l1,.l2,.l3{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="440" fill="#000"/>
  <rect width="1200" height="440" fill="url(#glow)"/>

  <text class="h" x="70" y="150" textLength="800" lengthAdjust="spacingAndGlyphs">MAKE IT <tspan class="r">WORK.</tspan></text>
  <text class="h" x="70" y="250" textLength="860" lengthAdjust="spacingAndGlyphs">MAKE IT <tspan class="r">SCALE.</tspan></text>
  <text class="sub" x="72" y="302">FULL STACK  /  CLOUD  /  PRODUCT</text>

  <!-- build log, ticks in sync with the packet -->
  <g transform="translate(960 92)">
    <text class="m" fill="#6b6b6b">~/avishek $ ship<tspan class="cur" fill="#FF1F1A"> ▍</tspan></text>
    <text class="m l1" y="34" fill="#F5F5F5"><tspan fill="#FF1F1A">✓</tspan> web      live</text>
    <text class="m l2" y="60" fill="#F5F5F5"><tspan fill="#FF1F1A">✓</tspan> mobile   shipped</text>
    <text class="m l3" y="86" fill="#F5F5F5"><tspan fill="#FF1F1A">✓</tspan> cloud    scaling</text>
  </g>

  <!-- pipeline: web -> mobile -> cloud -->
  <line x1="130" y1="362" x2="1070" y2="362" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="3 7"/>
  <g>
    <circle class="ring a1" cx="130" cy="362" r="12"/>
    <circle class="ring a2" cx="600" cy="362" r="12"/>
    <circle class="ring a3" cx="1070" cy="362" r="12"/>
    <circle cx="130" cy="362" r="9" fill="#000" stroke="#FF1F1A" stroke-width="3"/>
    <circle cx="600" cy="362" r="9" fill="#000" stroke="#FF1F1A" stroke-width="3"/>
    <circle cx="1070" cy="362" r="9" fill="#000" stroke="#FF1F1A" stroke-width="3"/>
  </g>
  <g>
    <circle r="9" fill="#FF3B30" filter="url(#blur)"/>
    <rect x="-90" y="-1.5" width="90" height="3" fill="url(#trail)"/>
    <circle r="4.5" fill="#fff"/>
    <animateMotion dur="8s" repeatCount="indefinite" path="M130,362 L1070,362" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.75;1"/>
  </g>
  <text class="lbl" x="130" y="408" text-anchor="middle">WEB</text>
  <text class="lbl" x="600" y="408" text-anchor="middle">MOBILE</text>
  <text class="lbl" x="1070" y="408" text-anchor="middle">CLOUD</text>
  <text class="tech" x="130" y="428" text-anchor="middle">React · Next.js</text>
  <text class="tech" x="600" y="428" text-anchor="middle">React Native</text>
  <text class="tech" x="1070" y="428" text-anchor="middle">AWS Serverless</text>
</svg>
