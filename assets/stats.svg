<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150">
  <style>
    .card{fill:#080808;stroke:#2a2a2a;stroke-width:1}
    .num{font:800 44px 'Segoe UI',Arial,sans-serif;fill:#FF1F1A}
    .lbl{font:13px Consolas,Menlo,monospace;fill:#bdbdbd;letter-spacing:2px}
    g{opacity:0;animation:in .8s ease forwards}
    g:nth-child(2){animation-delay:.2s}g:nth-child(3){animation-delay:.4s}
    @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  </style>
  <g><rect class="card" x="0" y="10" width="320" height="120" rx="10"/><text class="num" x="26" y="68">15+</text><text class="lbl" x="26" y="102">PRODUCTS SHIPPED</text></g>
  <g><rect class="card" x="340" y="10" width="320" height="120" rx="10"/><text class="num" x="366" y="68">5 DAYS</text><text class="lbl" x="366" y="102">IDEA TO PRODUCTION</text></g>
  <g><rect class="card" x="680" y="10" width="320" height="120" rx="10"/><text class="num" x="706" y="68">0.1 Mbps</text><text class="lbl" x="706" y="102">WORKS ON LOW BANDWIDTH</text></g>
</svg>
