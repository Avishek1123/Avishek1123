<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Hi, I'm Avishek. I take a product from design to deployment, then keep it fast when real people use it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="g" cx="0" cy="1" r="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#E10600" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#FF1F1A"/><stop offset=".6" stop-color="#E10600" stop-opacity=".5"/><stop offset="1" stop-color="#E10600" stop-opacity="0"/></linearGradient>
<clipPath id="wipe"><rect x="0" y="0" width="0" height="170"><animate attributeName="width" from="0" to="1200" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".6 0 .2 1"/></rect></clipPath>
<style>
.hi{font-family:'Arial Black','Helvetica Neue',Impact,Arial,sans-serif;font-weight:900;font-size:84px;fill:#F5F5F5}
.red{fill:#FF1F1A}
.tag{font-family:'Helvetica Neue',Arial,sans-serif;font-size:20px;fill:#cfcfcf}
.role{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:21px;fill:#F5F5F5}
.pr{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:21px;fill:#FF1F1A;font-weight:bold}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.ul{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:u 1s cubic-bezier(.6,0,.2,1) 1.1s forwards}@keyframes u{to{transform:scaleX(1)}}
.fadein{opacity:0;animation:f .8s ease 1.8s forwards}@keyframes f{to{opacity:1}}
.r0{opacity:0;animation:r0 12.0s infinite}@keyframes r0{0%,0.00%{opacity:0;transform:translateY(8px)}4.17%,20.83%{opacity:1;transform:translateY(0)}25.00%,100%{opacity:0;transform:translateY(-8px)}}.r1{opacity:0;animation:r1 12.0s infinite}@keyframes r1{0%,25.00%{opacity:0;transform:translateY(8px)}29.17%,45.83%{opacity:1;transform:translateY(0)}50.00%,100%{opacity:0;transform:translateY(-8px)}}.r2{opacity:0;animation:r2 12.0s infinite}@keyframes r2{0%,50.00%{opacity:0;transform:translateY(8px)}54.17%,70.83%{opacity:1;transform:translateY(0)}75.00%,100%{opacity:0;transform:translateY(-8px)}}.r3{opacity:0;animation:r3 12.0s infinite}@keyframes r3{0%,75.00%{opacity:0;transform:translateY(8px)}79.17%,95.83%{opacity:1;transform:translateY(0)}100.00%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ul{transform:none}.fadein{opacity:1}.r0{opacity:1}}
</style></defs>
<rect width="1200" height="290" fill="#000"/><rect width="1200" height="290" fill="url(#g)"/>
<g clip-path="url(#wipe)"><text class="hi" x="50" y="112" textLength="760" lengthAdjust="spacingAndGlyphs">Hi, I'm <tspan class="red">Avishek.</tspan></text></g>
<rect class="ul" x="50" y="140" width="1100" height="3" fill="url(#ln)"/>
<text class="tag fadein" x="50" y="190">I take a product from design to deployment, then keep it fast when real people use it.</text>
<g class="fadein"><text class="pr" x="50" y="252">&gt;</text><text class="role r0" x="86" y="252">full stack engineer</text><text class="role r1" x="86" y="252">cloud and serverless builder</text><text class="role r2" x="86" y="252">mobile app developer</text><text class="role r3" x="86" y="252">owner of products, end to end</text><rect class="cur" x="0" y="0" width="0" height="0"/></g>
</svg>