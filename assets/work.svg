<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 572" width="1200" height="572" role="img" aria-label="Selected work" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>.t{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:22px;fill:#F5F5F5}.tag{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-size:13px;fill:#FF1F1A}.d{font-family:'Helvetica Neue',Arial,sans-serif;font-size:15px;fill:#a8a8a8}.h{font-family:'Helvetica Neue',Arial,sans-serif;font-size:15px;fill:#F5F5F5}.k{fill:#FF1F1A;font-weight:bold}</style>
<rect width="1200" height="572" fill="#000"/>
<rect x="50" y="10" width="1100" height="180" fill="#0a0a0a" stroke="#222"/><rect x="50" y="10" width="4" height="180" fill="#E10600"/><text class="t" x="76" y="50">Pabitra Electricals system</text><text class="tag" x="76" y="72">20–30 people use it</text><text class="d" x="76" y="104">Runs day-to-day operations for a team of 20–30. My largest and most complex build.</text><text class="h" x="76" y="134"><tspan class="k">Hard part: </tspan>Requirements changed mid-build, so the database was restructured several times. I trimmed the API schema</text><text class="h" x="76" y="156">so responses carry only what the frontend needs.</text><rect x="50" y="214" width="538" height="202" fill="#0a0a0a" stroke="#222"/><rect x="50" y="214" width="4" height="202" fill="#E10600"/><text class="t" x="76" y="254">Tekkzy Fit</text><text class="tag" x="76" y="276">React Native · AWS · local network</text><text class="d" x="76" y="308">Gym desk app linked to a face-attendance terminal, with a</text><text class="d" x="76" y="330">staff web desk and cloud APIs.</text><text class="h" x="76" y="360"><tspan class="k">Hard part: </tspan>The phone finds the terminal on gym Wi-Fi by itself, queues</text><text class="h" x="76" y="382">punches offline, and syncs when staff reconnect.</text><rect x="612" y="214" width="538" height="202" fill="#0a0a0a" stroke="#222"/><rect x="612" y="214" width="4" height="202" fill="#E10600"/><text class="t" x="638" y="254">Crusher Management System</text><text class="tag" x="638" y="276">built in 5 days</text><text class="d" x="638" y="308">Tracks material production, expenses, sales and machines.</text><text class="h" x="638" y="338"><tspan class="k">Hard part: </tspan>Delivered end to end in 5 days, tuned to respond at 0.1</text><text class="h" x="638" y="360">Mbps. The client then referred Pabitra Electricals.</text><rect x="50" y="440" width="538" height="122" fill="#0a0a0a" stroke="#222"/><rect x="50" y="440" width="4" height="122" fill="#E10600"/><text class="t" x="76" y="480">Electricity billing software</text><text class="tag" x="76" y="502">about 600 bills a month</text><text class="d" x="76" y="534">Billing software for a live client.</text><rect x="612" y="440" width="538" height="122" fill="#0a0a0a" stroke="#222"/><rect x="612" y="440" width="4" height="122" fill="#E10600"/><text class="t" x="638" y="480">TekkzyWork</text><text class="tag" x="638" y="502">in progress</text><text class="d" x="638" y="534">HR management tool.</text>
</svg>